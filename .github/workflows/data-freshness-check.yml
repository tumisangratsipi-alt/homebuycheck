name: Data Freshness Check

# Reads data-sources.json and Slack-alerts when a real-world data source
# is due for a re-check, or was never independently audited in the first
# place. This is a reminder, not an auto-fetch - it never edits the real
# data files, it only tells a human when to look. This repo has no live
# source watcher at all yet (it's the newest satellite), so this job is
# the only automated coverage for city-data.ts and affordability-data.ts.

on:
  schedule:
    # Monthly - matches Zillow ZHVI's real update cadence, the fastest
    # source this repo's home-price data is built from.
    - cron: '0 9 1 * *'
  workflow_dispatch:

jobs:
  check-freshness:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run freshness check
        run: python scripts/check-data-freshness.py
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPO_NAME: homebuycheck

      - name: Check for state file changes
        id: diff
        run: |
          if git diff --quiet .data-freshness-state.json 2>/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit alert state
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@homebuycheck.com"
          git add .data-freshness-state.json
          git commit -m "chore: record data freshness alert state"
          git push
